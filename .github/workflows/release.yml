name: Release

# Si avvia creando un tag di versione, es.:
#   git tag v0.1.0 && git push origin v0.1.0
# Un tag con trattino (v0.2.0-beta.1) diventa una pre-release.
# In alternativa si avvia a mano (Actions → Release → Run workflow) indicando il tag:
# viene creato sull'ultimo commit del branch scelto.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag della release, es. v0.1.0-alpha.3'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Tag non valido: $env:TAG" }
          $version = $env:TAG.TrimStart('v')
          # Version di .NET accetta solo la parte numerica; quella completa va in InformationalVersion.
          $numeric = $version.Split('-')[0]
          "full=$version" >> $env:GITHUB_OUTPUT
          "numeric=$numeric" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --project tests/ClawHub.Core.Tests -c Release

      - name: Publish
        shell: pwsh
        run: |
          $full = "${{ steps.version.outputs.full }}"
          $numeric = "${{ steps.version.outputs.numeric }}"
          foreach ($arch in @('x64', 'ARM64')) {
            $rid = "win-$($arch.ToLower())"
            dotnet publish src/ClawHub.App -c Release -r $rid -p:Platform=$arch `
              -p:Version=$numeric -p:InformationalVersion=$full -o "publish/$rid"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            .github/scripts/Test-PublishOutput.ps1 -Path "publish/$rid"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Compress-Archive -Path "publish/$rid/*" -DestinationPath "ClawHubGames-$full-$rid.zip"
          }

      - name: Installer and updates (Velopack, x64)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $full = "${{ steps.version.outputs.full }}"
          dotnet tool install -g vpk --version 1.2.161
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $out = "releases/win-x64"
          # L'ultima release serve per creare l'aggiornamento "delta" (solo le differenze). La prima volta non c'è.
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --channel win-x64 --outputDir $out --token $env:GH_TOKEN --pre
          if ($LASTEXITCODE -ne 0) { Write-Host "Nessuna release Velopack precedente: niente delta"; $global:LASTEXITCODE = 0 }
          vpk pack --packId ClawHubGamesApp --packVersion $full --packDir publish/win-x64 --mainExe ClawHubGames.exe `
            --packTitle "Claw Hub Games" --packAuthors "Fabio Brunetti" --channel win-x64 --runtime win-x64 --outputDir $out --noPortable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem $out

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG
          # --target serve solo all'avvio manuale, quando il tag non esiste ancora.
          $flags = @('--generate-notes', '--title', "Claw Hub Games $tag", '--target', '${{ github.sha }}')
          if ($tag.Contains('-')) { $flags += '--prerelease' }
          # Zip portable + Setup e pacchetti Velopack di questa versione (non quelli scaricati della precedente).
          $full = "${{ steps.version.outputs.full }}"
          $assets = @((Get-ChildItem ClawHubGames-*.zip).FullName)
          $assets += Get-ChildItem releases/win-x64 -File |
            Where-Object { $_.Extension -ne '.nupkg' -or $_.Name -like "*$full*" } |
            ForEach-Object { $_.FullName }
          gh release create $tag $assets @flags
